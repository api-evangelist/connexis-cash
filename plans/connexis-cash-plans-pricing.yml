description: >-
  BNP Paribas CIB publishes NO plans and NO pricing for the Connexis Cash PSD2 Account Information API.
  There is no pricing page on the developer portal, no tier table, no quota table and no "contact sales"
  pricing gate. This is expected and correct for the surface: PSD2 obliges an ASPSP to make the account
  information interface available to authorised third-party providers without charging them for it, so
  there is no commercial plan to publish. Access is governed by regulatory eligibility — an eIDAS QWAC
  from a QTSP and an EBA reference code — not by a subscription.
plan_count: 0
plans: []
access_model:
  gate: regulatory eligibility, not payment
  sandbox:
    cost: none stated
    requirement: portal account (username + email), an app registered for a key and secret, and app authorisation within 24h
    signup: https://developers.cib.bnpparibas.com/index.php/user/register
  production:
    cost: none stated
    requirement: >-
      QWAC certificate delivered by a QTSP, a registered callback URL, and an EBA reference code, sent to
      dl.cib.api.psd2.support@bnpparibas.com for manual onboarding.
  underlying_product:
    note: >-
      Connexis Cash itself — the corporate digital banking platform this API reads from — is a
      commercial BNP Paribas CIB service sold to corporate clients under a banking relationship. Its
      pricing is not published on any public page and is not part of this API's terms.
searched_for:
  - path_or_page: developer portal navigation
    result: no Pricing link exists — the nav carries only API Catalog, How to, FAQ, Terms of use, Log in.
  - path_or_page: /index.php/terms-of-use
    result: 200 — terms of use, no fee schedule.
  - path_or_page: /index.php/docs/get-started
    result: 200 — registration and app-authorisation steps, no pricing.
  - path_or_page: /index.php/api-docs/account-information-psd2-stet-mock
    result: 200 — full API description, no pricing.
note: >-
  plan_count is 0 because the provider publishes zero plans, not because none was found. Recording the
  honest zero is the measurement. A previous version of this file carried three invented tiers (Free /
  Professional / Enterprise with 10, 100 and 1000 requests-per-minute limits and TBD prices) written by
  a 2026-05-04 bulk scaffold sweep; none of those figures came from BNP Paribas and they have been
  removed.
