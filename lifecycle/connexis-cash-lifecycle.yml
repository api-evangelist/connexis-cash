catalog_note:
  finding: >-
    CONTRACT MISMATCH IN THIS REPO, raised for a follow-up pass. Before this round the only spec in the
    repo was openapi/_original/connexis-cash-openapi.yml (240 lines, six /v1/ paths, no operationIds)
    and five tag-split files derived from it. The contract BNP Paribas CIB actually publishes — now
    harvested to openapi/connexis-cash-account-information-psd2-stet-mock-openapi.yml — is OpenAPI
    3.0.0, ~100KB, version 2.0.0, with FOUR /v2/ paths and real operationIds.
  specific_conflicts:
    - >-
      The pre-existing spec declares POST /v1/consents. The published contract states in its own
      description that "CONNEXIS Cash will not implement such request in the sandbox environment and in
      the production environment", because Connexis Cash uses the Full-AISP (A1) model. That operation
      does not exist.
    - The path version differs — /v1/* versus the published /v2/*.
    - >-
      The pre-existing spec names only the production host; the published contract's servers[] names
      the sandbox host, and the production host is stated in prose.
  affected_files:
    - openapi/_original/connexis-cash-openapi.yml
