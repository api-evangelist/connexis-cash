components:
  schemas:
    TransactionStatus:
      description: 'Type of Transaction

        - BOOK: (ISO20022 ClosingBooked) Accounted transaction

        - PDNG: (ISO20022 Expected) Instant Balance Transaction

        - OTHR: Other

        '
      type: string
      enum:
      - BOOK
      - PDNG
      - OTHR
    AccountResource:
      description: 'PSU account that is made available to the TPP

        '
      type: object
      required:
      - name
      - cashAccountType
      - currency
      - _links
      properties:
        resourceId:
          $ref: '#/components/schemas/ResourceId'
        bicFi:
          description: 'ISO20022: Code allocated to a financial institution by the ISO 9362 Registration Authority as described in ISO 9362 "Banking - Banking telecommunication messages - Business identification code (BIC)".

            '
          type: string
          pattern: ^[A-Z]{6,6}[A-Z2-9][A-NP-Z0-9]([A-Z0-9]{3,3}){0,1}$
        accountId:
          $ref: '#/components/schemas/AccountIdentification'
        name:
          description: 'Label of the PSU account

            In case of a delayed debit card transaction set, the name shall specify the holder name and the imputation date

            '
          type: string
          maxLength: 70
        details:
          description: 'Specifications that might be provided by the ASPSP

            - characteristics of the account

            - characteristics of the relevant card

            '
          type: string
          maxLength: 140
        linkedAccount:
          description: Case of a set of pending card transactions, the APSP will provide the relevant cash account the card is set up on.
          type: string
          maxLength: 70
        usage:
          description: 'Specifies the usage of the account

            - PRIV: private personal account

            - ORGA: professional account

            '
          type: string
          enum:
          - PRIV
          - ORGA
        cashAccountType:
          description: 'Specifies the type of the account

            - CACC: Cash account

            - CARD: List of card based transactions

            '
          type: string
          enum:
          - CACC
          - CARD
        product:
          description: 'Product Name of the Bank for this account, proprietary definition

            '
          type: string
          maxLength: 35
        currency:
          description: Currency used for the account
          type: string
          maxLength: 3
        balances:
          description: list of balances provided by the ASPSP
          type: array
          items:
            $ref: '#/components/schemas/BalanceResource'
          minItems: 1
        psuStatus:
          description: Relationship between the PSU and the account - Account Holder - Co-account Holder - Attorney
          type: string
          maxLength: 35
        _links:
          $ref: '#/components/schemas/AccountLinks'
      example:
        resourceId: '1306171745'
        bicFi: BNPAPLPXXXX
        name: TXW PXXXKX XP. Z X.X.
        usage: ORGA
        accountId:
          iban: PL97-2350-0002-0110-0099-0018-9978
          other: null
        cashAccountType: CACC
        currency: EUR
        psuStatus: ''
        _links:
          balances:
            href: v1/accounts/1306171745/balances
          transactions:
            href: v1/accounts/1306171745/transactions
    GenericIdentification:
      description: 'ISO20022: Unique identification of an account, a person or an organisation, as assigned by an issuer.

        API: The ASPSP will document which account reference type it will support.

        '
      type: object
      properties:
        identification:
          description: 'API: Identifier

            '
          type: string
          maxLength: 70
        schemeName:
          description: 'Name of the identification scheme.

            Possible values for the scheme name, partially based on ISO20022 external code list, are the following:

            - BANK (BankPartyIdentification): Unique and unambiguous assignment made by a specific bank or similar financial institution to identify a relationship as defined between the bank and its client.

            - COID (CountryIdentificationCode) : Country authority given organisation identification (e.g., corporate registration number)

            - SREN (SIREN): The SIREN number is a 9 digit code assigned by INSEE, the French National Institute for Statistics and Economic Studies, to identify an organisation in France.

            - SRET (SIRET): The SIRET number is a 14 digit code assigned by INSEE, the French National Institute for Statistics and Economic Studies, to identify an organisation unit in France. It consists of the SIREN number, followed by a five digit classification number, to identify the local geographical unit of that entity.

            - NIDN (NationalIdentityNumber): Number assigned by an authority to identify the national identity number of a person.

            Other values are also permitted, for instance:

            - OAUT (OAUTH2): OAUTH2 access token that is owned by the PISP being also an AISP and that can be used in order to identify the PSU

            - CPAN (CardPan): Card PAN

            '
          type: string
          maxLength: 70
        issuer:
          description: 'ISO20022: Entity that assigns the identification. this could a country code or any organisation name or identifier that can be recognized by both parties

            '
          type: string
          maxLength: 35
      example:
        identification: 12FR5
        schemeName: COID
        issuer: FR
    AccountLinks:
      description: 'links that can be used for further navigation when browsing Account Information at one account level

        - balances: link to the balances of a given account

        - transactions: link to the transactions of a given account

        '
      type: object
      readOnly: true
      properties:
        balances:
          $ref: '#/components/schemas/GenericLink'
        transactions:
          $ref: '#/components/schemas/GenericLink'
      example:
        balances:
          href: v1/accounts/Alias1/balances-report
        transactions:
          href: v1/accounts/Alias1/transactions
    BalanceStatus:
      description: 'Type of balance

        - CLBD: (ISO20022 ClosingBooked) Accounting Balance

        - XPCD: (ISO20022 Expected) Instant Balance

        - VALU: Value-date balance

        - OTHR: Other Balance

        '
      type: string
      enum:
      - CLBD
      - XPCD
      - VALU
      - OTHR
    FinancialInstitutionIdentification:
      description: 'ISO20022: Unique and unambiguous identification of a financial institution, as assigned under an internationally recognised or proprietary identification scheme.

        '
      type: object
      required:
      - bicFi
      properties:
        bicFi:
          description: 'ISO20022: Code allocated to a financial institution by the ISO 9362 Registration Authority as described in ISO 9362 "Banking - Banking telecommunication messages - Business identification code (BIC)".

            '
          type: string
          pattern: ^[A-Z]{6,6}[A-Z2-9][A-NP-Z0-9]([A-Z0-9]{3,3}){0,1}$
        clearingSystemMemberId:
          $ref: '#/components/schemas/ClearingSystemMemberIdentification'
        name:
          type: string
          description: Name of the financial institution
          maxLength: 140
        postalAddress:
          $ref: '#/components/schemas/PostalAddress'
      example:
        bicFi: BNKAFRPPXXX
    PartyIdentification:
      description: 'API : Description of a Party which can be either a person or an organization.

        '
      type: object
      required:
      - name
      properties:
        name:
          description: 'ISO20022: Name by which a party is known and which is usually used to identify that party.

            '
          type: string
          maxLength: 140
        postalAddress:
          $ref: '#/components/schemas/PostalAddress'
        organisationId:
          description: Unique and unambiguous way to identify an organisation.
          $ref: '#/components/schemas/GenericIdentification'
        privateId:
          description: Unique and unambiguous identification of a person.
          $ref: '#/components/schemas/GenericIdentification'
      example:
        name: MyPreferedPisp
        postalAddress:
          country: FR
          addressLine:
          - 18 rue de la DSP2
          - 75008 PARIS
    ClearingSystemMemberIdentification:
      description: 'ISO20022: Information used to identify a member within a clearing system.

        API: to be used for some specific international credit transfers in order to identify the beneficiary bank

        '
      type: object
      properties:
        clearingSystemId:
          description: 'ISO20022: Specification of a pre-agreed offering between clearing agents or the channel through which the payment instruction is processed.

            '
          type: string
          maxLength: 35
        memberId:
          description: 'ISO20022: Identification of a member of a clearing system.

            '
          type: string
          maxLength: 35
      example: "{\n  \"clearingSystemId\" : \"NZNCC\",\n  \"memberId\" : \"020368\"\n}\n"
    PsuContextLinks:
      description: 'Links that can be used for further navigation when browsing Account Information at top level

        - self: link to the list of all available accounts

        '
      type: object
      readOnly: true
      required:
      - self
      properties:
        self:
          $ref: '#/components/schemas/GenericLink'
        beneficiaries:
          $ref: '#/components/schemas/GenericLink'
        first:
          $ref: '#/components/schemas/GenericLink'
        last:
          $ref: '#/components/schemas/GenericLink'
        next:
          $ref: '#/components/schemas/GenericLink'
        prev:
          $ref: '#/components/schemas/GenericLink'
      example:
        self:
          href: v1/accounts?page=2
        first:
          href: v1/accounts
        last:
          href: v1/accounts?page=last
          templated: true
        next:
          href: v1/accounts?page=3
          templated: true
        prev:
          href: v1/accounts
          templated: true
    TransactionsLinks:
      description: 'links that can be used for further navigation when browsing Account Information at one account level

        - self: link to the transactions of a given account

        - parent-list: link to the list of all available accounts

        - balances: link to the balances of a given account

        - first: link to the first page of the transactions result

        - last: link to the last page of the transactions result

        - next: link to the next page of the transactions result

        - prev: link to the previous page of the transactions result

        '
      type: object
      readOnly: true
      required:
      - self
      properties:
        self:
          $ref: '#/components/schemas/GenericLink'
        parent-list:
          $ref: '#/components/schemas/GenericLink'
        balances:
          $ref: '#/components/schemas/GenericLink'
        first:
          $ref: '#/components/schemas/GenericLink'
        last:
          $ref: '#/components/schemas/GenericLink'
        next:
          $ref: '#/components/schemas/GenericLink'
        prev:
          $ref: '#/components/schemas/GenericLink'
      example:
        self:
          href: v1/accounts/19737007345/transactions
        parent-list:
          href: v1/accounts
        balances:
          href: v1/accounts/19737007345/balances
        last:
          href: v1/accounts/19737007345/transactions?page=last
        next:
          href: v1/accounts/19737007345/transactions?page=3
    BalanceResource:
      description: Structure of an account balance
      type: object
      required:
      - name
      - balanceAmount
      - balanceType
      properties:
        name:
          description: Label of the balance
          type: string
          maxLength: 70
        balanceAmount:
          $ref: '#/components/schemas/AmountType'
        balanceType:
          $ref: '#/components/schemas/BalanceStatus'
        lastChangeDateTime:
          description: Timestamp of the last change of the balance amount
          type: string
          format: date-time
        referenceDate:
          description: Reference date for the balance
          type: string
          format: date
        lastCommittedTransaction:
          description: 'Identification of the last committed transaction. This is actually useful for instant balance.

            '
          type: string
          maxLength: 40
      example:
        name: Ledger Booked 2018-06-20
        balanceAmount:
          currency: EUR
          amount: '12002'
        balanceType: CLBD
        lastCommittedTransaction: null
        referenceDate: '2018-06-20'
    HalBeneficiaries:
      description: HYPERMEDIA structure used for returning the list of the whitelisted beneficiaries
      type: object
      required:
      - beneficiaries
      - _links
      properties:
        beneficiaries:
          type: array
          description: List of trusted beneficiaries
          items:
            $ref: '#/components/schemas/Beneficiary'
        _links:
          $ref: '#/components/schemas/BeneficiariesLinks'
    AmountType:
      description: 'ISO20022: structure aiming to carry either an instructed amount or equivalent amount. Both structures embed the amount and the currency to be used.


        API: only instructed amount can be used

        '
      type: object
      required:
      - currency
      - amount
      properties:
        currency:
          description: 'Specifies the currency of the amount. A code allocated to a currency by a Maintenance Agency under an international identification scheme, as described in the latest edition of the international standard ISO 4217 "Codes for the representation of currencies and funds".

            '
          type: string
          pattern: ^[A-Z]{3,3}$
        amount:
          description: 'ISO20022: Amount of money to be moved between the debtor and creditor, before deduction of charges, expressed in the currency as ordered by the initiating party.

            '
          type: string
          pattern: ^\-{0,1}[0-9]{1,13}(\.[0-9]{0,5}){0,1}$
      example:
        currency: EUR
        amount: '12.25'
    Beneficiary:
      description: Specification of a beneficiary
      type: object
      required:
      - creditor
      - creditorAgent
      properties:
        id:
          type: string
          description: Id of the beneficiary
          pattern: ^([a-zA-Z0-9 \/\-?:\()\.,']{1,35})$
        isTrusted:
          description: 'The ASPSP having not implemented the trusted beneficiaries list must not set this flag.

            Otherwise, the ASPSP indicates whether or not the beneficiary has been registered by the PSU within the trusted beneficiaries list.

            - true: the beneficiary is actually a trusted beneficiary (when set by ASPSP)

            - false: the beneficiary is not a trusted beneficiary

            The PISP may set this flag to "true" to indicate that the PSU considers the beneficiary as trusted and to be inserted within the trusted beneficiaries list, as far as this feature was implemented by the ASPSP.

            - true: the beneficiary should be registered as a trusted beneficiary (when set by PISP)

            '
          type: boolean
        creditorAgent:
          $ref: '#/components/schemas/FinancialInstitutionIdentification'
        creditor:
          $ref: '#/components/schemas/PartyIdentification'
        creditorAccount:
          $ref: '#/components/schemas/AccountIdentification'
      example: null
    ErrorModel:
      description: Generic error report structure
      type: object
      required:
      - status
      - message
      properties:
        timestamp:
          description: current timestamp
          type: string
          format: date-time
        status:
          description: HTTP error code
          type: integer
          format: int32
        error:
          description: HTTP error text
          type: string
          maxLength: 140
        message:
          description: HTTP textual reason phrase
          type: string
          maxLength: 140
        path:
          description: Relevant path that was used
          type: string
          maxLength: 140
      example:
        timestamp: 2019-01-01T00:00:00.000+0000
        status: 4XX or 5XX
        error: Standard HTTP Status error code
        message: 'The reason why, for example, error code 404, you will get massage: Not found, no request available.'
        path: /v1/(this request path)
    HalBalances:
      description: HYPERMEDIA structure used for returning the list of the relevant balances for a given account to the AISP
      type: object
      required:
      - balances
      - _links
      properties:
        balances:
          description: List of account balances
          type: array
          items:
            $ref: '#/components/schemas/BalanceResource'
          minItems: 1
        _links:
          $ref: '#/components/schemas/BalancesLinks'
    HalAccounts:
      description: HYPERMEDIA structure used for returning the list of the available accounts to the AISP
      type: object
      required:
      - accounts
      - _links
      properties:
        connectedPsu:
          description: 'Last name and first name that has granted access to the AISP on the accounts data

            This information can be retrieved based on the PSU''s authentication that occurred during the OAUTH2 access token initialisation.

            '
          type: string
          maxLength: 70
          example: User 1
        accounts:
          description: 'List of PSU account that are made available to the TPP

            '
          type: array
          items:
            $ref: '#/components/schemas/AccountResource'
        _links:
          $ref: '#/components/schemas/PsuContextLinks'
    BeneficiariesLinks:
      description: 'links that can be used for further navigation when browsing Account Information at one account level

        - self: link to the beneficiaries

        - parent-list: link to the list of all available accounts

        - first: link to the first page of the beneficiaries result

        - last: link to the last page of the beneficiaries result

        - next: link to the next page of the beneficiaries result

        - prev: link to the previous page of the beneficiaries result

        '
      type: object
      readOnly: true
      required:
      - self
      properties:
        self:
          $ref: '#/components/schemas/GenericLink'
        parent-list:
          $ref: '#/components/schemas/GenericLink'
        first:
          $ref: '#/components/schemas/GenericLink'
        last:
          $ref: '#/components/schemas/GenericLink'
        next:
          $ref: '#/components/schemas/GenericLink'
        prev:
          $ref: '#/components/schemas/GenericLink'
      example:
        self:
          href: v1/trusted-beneficiaries
        parent-list:
          href: v1/accounts
        last:
          href: v1/trusted-beneficiaries?page=last
        next:
          href: v1/trusted-beneficiaries?page=1
    AccountIdentification:
      description: Unique and unambiguous identification for the account between the account owner and the account servicer.
      type: object
      required:
      - iban
      properties:
        iban:
          description: 'ISO20022: International Bank Account Number (IBAN) - identification used internationally by financial institutions to uniquely identify the account of a customer.


            Further specifications of the format and content of the IBAN can be found in the standard ISO 13616 "Banking and related financial services - International Bank Account Number (IBAN)" version 1997-10-01, or later revisions.

            '
          type: string
          pattern: ^[A-Z]{2,2}[0-9]{2,2}[a-zA-Z0-9]{1,30}$
        other:
          $ref: '#/components/schemas/GenericIdentification'
      example:
        Iban: YY64COJH41059545330222956960771321
    Transaction:
      description: structure of a transaction
      type: object
      required:
      - transactionAmount
      - status
      - creditDebitIndicator
      - bookingDate
      - remittanceInformation
      properties:
        resourceId:
          $ref: '#/components/schemas/ResourceId'
        entryReference:
          type: string
          description: 'Technical incremental identification of the transaction.

            '
          maxLength: 40
        transactionAmount:
          $ref: '#/components/schemas/AmountType'
        creditDebitIndicator:
          description: 'Accounting flow of the transaction

            - CRDT: Credit type transaction

            - DBIT: Debit type transaction

            '
          type: string
          enum:
          - CRDT
          - DBIT
        status:
          $ref: '#/components/schemas/TransactionStatus'
        bookingDate:
          description: Booking date of the transaction on the account
          type: string
          format: date
        valueDate:
          description: Value date of the transaction on the account
          type: string
          format: date
        transactionDate:
          description: 'Date used for specific purposes:

            - for card transaction: date of the transaction

            - for credit transfer: acquiring date of the transaction

            - for direct debit: receiving date of the transaction

            '
          type: string
          format: date
        remittanceInformation:
          $ref: '#/components/schemas/UnstructuredRemittanceInformation'
      example:
        resourceId: null
        entryReference: ''
        transactionAmount:
          currency: DKK
          amount: '500'
        creditDebitIndicator: DBIT
        status: BOOK
        bookingDate: '2018-11-22'
        valueDate: '2018-11-22'
        transactionDate: '2018-11-22'
        remittanceInformation: /BENM/ANGULAR
    HalTransactions:
      description: HYPERMEDIA structure used for returning the list of the transactions for a given account to the AISP
      type: object
      required:
      - transactions
      - _links
      properties:
        transactions:
          description: List of transactions
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        _links:
          $ref: '#/components/schemas/TransactionsLinks'
    GenericLink:
      description: hypertext reference
      type: object
      required:
      - href
      properties:
        href:
          description: URI to be used
          type: string
          maxLength: 140
        templated:
          description: specifies "true" if href is a URI template, i.e. with parameters. Otherwise, this property is absent or set to false
          type: boolean
      example:
        href: v1/accounts/Alias1/balances
    BalancesLinks:
      description: 'links that can be used for further navigation when browsing Account Information at one account level

        - self: link to the balances of a given account

        - parent-list: link to the list of all available accounts

        - transactions: link to the transactions of a given account

        '
      type: object
      readOnly: true
      required:
      - self
      properties:
        self:
          $ref: '#/components/schemas/GenericLink'
        parent-list:
          $ref: '#/components/schemas/GenericLink'
        transactions:
          $ref: '#/components/schemas/GenericLink'
      example:
        self:
          href: v1/accounts/1306171745/balances
        parent-list:
          href: v1/accounts
        transactions:
          href: v1/accounts/1306171745/transactions
    gatewayErrors:
      type: string
      properties:
        title:
          type: string
        detail:
          type: string
    UnstructuredRemittanceInformation:
      description: 'ISO20022: Information supplied to enable the matching of an entry with the items that the transfer is intended to settle, such as commercial invoices in an accounts'' receivable system.

        API: Only one occurrence is allowed

        '
      type: array
      items:
        type: string
        description: Relevant information to the transaction
        title: remittanceLine
        maxLength: 140
    PostalAddress:
      description: 'ISO20022 : Information that locates and identifies a specific address, as defined by postal services.

        '
      type: object
      required:
      - country
      - addressLine
      properties:
        country:
          description: 'ISO20022: Country in which a person resides (the place of a person''s home). In the case of a company, it is the country from which the affairs of that company are directed.

            '
          type: string
          pattern: ^([A-Z]{2,2})$
        addressLine:
          description: Unstructured address. The two lines must embed zip code and town name
          type: array
          items:
            description: Address line
            type: string
            maxItems: 2
            maxLength: 70
      example:
        country: FR
        addressLine:
        - 18 rue de la DSP2
        - 75008 PARIS
    ResourceId:
      description: 'API: Identifier assigned by the ASPSP for further use of the created resource through API calls

        '
      type: string
      pattern: ^([a-zA-Z0-9 \/\-?:\()\.,']{1,35})$
      readOnly: true
  responses:
    '204':
      description: No content.
      headers:
        X-Request-ID:
          description: 'Correlation header to be set in a request and retrieved in the relevant response

            '
          schema:
            type: string
    '500':
      description: Internal server error.
      headers:
        X-Request-ID:
          description: 'Correlation header to be set in a request and retrieved in the relevant response

            '
          schema:
            type: string
      content:
        '*/*':
          schema:
            $ref: '#/components/schemas/ErrorModel'
    '403':
      description: Forbidden, authentication successful but access to resource is not allowed.
      headers:
        X-Request-ID:
          description: 'Correlation header to be set in a request and retrieved in the relevant response

            '
          schema:
            type: string
      content:
        '*/*':
          schema:
            $ref: '#/components/schemas/ErrorModel'
    '400':
      description: Invalid status value
      headers:
        X-Request-ID:
          description: 'Correlation header to be set in a request and retrieved in the relevant response

            '
          schema:
            type: string
      content:
        '*/*':
          schema:
            $ref: '#/components/schemas/ErrorModel'
    '405':
      description: Method Not Allowed.
      headers:
        X-Request-ID:
          description: 'Correlation header to be set in a request and retrieved in the relevant response

            '
          schema:
            type: string
      content:
        '*/*':
          schema:
            $ref: '#/components/schemas/ErrorModel'
    '401':
      description: Unauthorized,  Access token is missing or invalid.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/correlationIdHeader'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/gatewayErrors'
    '429':
      description: Too many requests.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/correlationIdHeader'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/gatewayErrors'
    '408':
      description: Request Timeout.
      headers:
        X-Request-ID:
          description: 'Correlation header to be set in a request and retrieved in the relevant response

            '
          schema:
            type: string
      content:
        '*/*':
          schema:
            $ref: '#/components/schemas/ErrorModel'
    '503':
      description: Service unavailable.
      headers:
        X-Request-ID:
          description: 'Correlation header to be set in a request and retrieved in the relevant response

            '
          schema:
            type: string
      content:
        '*/*':
          schema:
            $ref: '#/components/schemas/ErrorModel'
    '406':
      description: Not Acceptable.
      headers:
        X-Request-ID:
          description: 'Correlation header to be set in a request and retrieved in the relevant response

            '
          schema:
            type: string
      content:
        '*/*':
          schema:
            $ref: '#/components/schemas/ErrorModel'
    '404':
      description: Not found, no resource available.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/correlationIdHeader'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/gatewayErrors'
  parameters:
    PsuAcceptCharsetHeader:
      name: PSU-Accept-Charset
      in: header
      description: '"Accept-Charset" header field sent by the PSU terminal when connecting to the TPP

        '
      schema:
        type: string
    PsuDateHeader:
      name: PSU-Date
      in: header
      description: Timestamp of the most relevant PSU’s terminal request to the TTP
      schema:
        type: string
    PsuHttpMethodHeader:
      name: PSU-HTTP-Method
      in: header
      description: Http method for the most relevant PSU’s terminal request to the TTP
      schema:
        type: string
    PsuDeviceId:
      name: PSU-Device-ID
      in: header
      description: 'UUID (Universally Unique Identifier) for a device, which is used by the PSU, if available.

        UUID identifies either a device or a device dependant application installation.

        In case of installation identification this ID need to be unaltered until removal from device.

        '
      schema:
        type: string
    AccountResourceIdentification:
      name: accountResourceId
      in: path
      description: Identification of account resource to fetch
      required: true
      schema:
        type: string
        pattern: ^([a-zA-Z0-9 \/\-?:\()\.,']{1,35})$
    PsuIpAddressHeader:
      name: PSU-IP-Address
      in: header
      description: IP address used by the PSU's terminal when connecting to the TPP
      schema:
        type: string
    pageNumber:
      name: pageNumber
      in: query
      description: 'Specifies a page number in case of a pagination

        '
      required: false
      schema:
        type: integer
        format: int32
    Correlation:
      name: X-Request-ID
      in: header
      required: true
      description: 'Correlation header to be set in a request and retrieved in the relevant response

        '
      schema:
        type: string
        maxLength: 70
    PsuUserAgentHeader:
      name: PSU-User-Agent
      in: header
      description: '"User-Agent" header field sent by the PSU terminal when connecting to the TPP

        '
      schema:
        type: string
    ToImputationDate:
      name: entryDateTo
      in: query
      description: 'Exclusive maximal imputation date of the transactions.

        Transactions having an imputation date equal to this parameter are not included within the result.

        '
      required: false
      schema:
        type: string
        format: date-time
    SignatureHeader:
      name: Signature
      in: header
      required: true
      description: 'http-signature of the request.

        The keyId must specify the way to get the relevant qualified certificate. It is requested that this identifier is an URL aiming to provide the relevant Qualified Certificate.

        '
      schema:
        type: string
    PsuAcceptLanguageHeader:
      name: PSU-Accept-Language
      in: header
      description: '"Accept-Language" header field sent by the PSU terminal when connecting to the TPP

        '
      schema:
        type: string
    PsuIpPortHeader:
      name: PSU-IP-Port
      in: header
      description: IP port used by the PSU's terminal when connecting to the TPP
      schema:
        type: string
    DigestHeader:
      name: Digest
      in: header
      required: false
      description: Digest of the body
      schema:
        type: string
    PsuAcceptEncodingHeader:
      name: PSU-Accept-Encoding
      in: header
      description: '"Accept-Encoding" header field sent by the PSU terminal when connecting to the TPP

        '
      schema:
        type: string
    PsuRefererHeader:
      name: PSU-Referer
      in: header
      description: '"Referer" header field sent by the PSU terminal when connecting to the TPP.

        Notice that an initial typo in RFC 1945 specifies that "referer" (incorrect spelling) is to be used. The correct spelling "referrer" can be used but might not be understood.

        '
      schema:
        type: string
    pageSize:
      name: pageSize
      in: query
      description: 'Specifies the number of transactions to be displayed in the page in case of pagination

        '
      required: false
      schema:
        type: integer
        format: int32
    PsuGeoLocation:
      name: PSU-GEO-Location
      in: header
      description: Geographical location of the PSU as provided by the PSU mobile terminal if any to the TPP
      schema:
        type: string
    PsuAcceptHeader:
      name: PSU-Accept
      in: header
      description: '"Accept" header field sent by the PSU terminal when connecting to the TPP

        '
      schema:
        type: string
    FromImputationDate:
      name: entryDateFrom
      in: query
      description: 'Inclusive minimal imputation date of the transactions.

        Transactions having an imputation date equal to this parameter are included within the result.

        '
      required: false
      schema:
        type: string
        format: date-time
  headers:
    correlationIdHeader:
      description: Correlation header to be set in a request and retrieved in the relevant response
      schema:
        type: string
  securitySchemes:
    OAuth2:
      description: 'In order to access each of the 3 scopes in Production environment, the TPP needs to get an authorization code grant OAUTH2 token.

        The client_id field within the token request must be filled with the value of the organization identifier attribute that has been set in the distinguished name of eIDAS certificate of the TPP, according to ETSI recommandations.

        (cf §5.2.1 of https://docbox.etsi.org/ESI/Open/Latest_Drafts/ts_119495v000003_for-public-review.pdf)

        '
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.sandbox.cib.bnpparibas.com/oauth2/v1/token
          scopes:
            aisp: Access by an AISP to one given PSU's account
            cib-gb-account-information-psd2-stet-mock:pisp: Access by a PISP to payments resources
            cib-gb-account-information-psd2-stet-mock:piisp: Access by a PIISP to one given PSU's account to check payment coverage
