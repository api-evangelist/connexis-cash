openapi: 3.2.0
info:
  version: 2.0.0
  x-stet-version: 1.4.0.47
  title: Account Information (PSD2 STET Mock) AISP API
  x-generate-global-scope: true
  description: '## Overview

    Third Party Providers can consume the PSD2 AISP API to retrieve account information from Connexis Cash.'
servers:
- url: https://api.sandbox.cib.bnpparibas.com/gb-account-information-psd2-stet-mock
  description: PROD_INTERNET
tags:
- name: AISP
paths:
  /v2/accounts:
    get:
      operationId: accountsGet
      tags:
      - AISP
      summary: Retrieval of the PSU accounts (AISP)
      description: '### Description


        This call returns all payment accounts that are relevant to the PSU on behalf of whom the AISP is connected.


        *This requests makes available all the accounts which are available today in the Reporting module of Connexis Cash. The returned accounts might differ from the ones used for payment, and should therefore not be used for Payment Initiation.*


        Thanks to HYPERMEDIA, each account is returned with the links aiming to ease access to the relevant transactions and balances.


        The result may be subject to pagination (i.e. retrieving a partial result in case of having too many results) through a set of pages by the ASPSP. Thereafter, the AISP may ask for the first, next, previous or last page of results.


        *Attention : the « name » account field is not necessarily an IBAN, this name is customizable by the client. Furthermore, some optional fields present in the STET documentation are not communicated through the API because they are currently not transmitted to our clients or they are specific to the retail segment (psuStatus, linkedAccount, product)*


        ### Prerequisites


        - The TPP has been registered by the Registration Authority for the AISP role. (not mandatory for Sandbox)

        - The TPP and the PSU have a contract that has been enrolled by the ASPSP (not mandatory for Sandbox)

        - At this step, Connexis Cash has delivered an OAUTH2 access token to the TPP via OAuth2 flow : Authorization Code Grant (for production) or Client Credential (for sandbox).


        For more details about OAuth2 flow, please click on the links below :


        - Authorization Code Grant flow : https://developers.cib.bnpparibas.com/docs/auth2-ac-psd2


        - Client Credential flow : https://developers.cib.bnpparibas.com/docs/auth2-cc


        - The TPP and the ASPSP have successfully processed a mutual check and authentication

        - The TPP has presented its OAUTH2 access token

        - Connexis Cash takes into account the access token that establishes the link between the PSU and the AISP.


        ### Business Flow


        - The TPP sends a request to the ASPSP for retrieving the list of the PSU payment accounts. The ASPSP computes the relevant PSU accounts and builds the answer as an accounts list.


        - The result may be subject to pagination in order to avoid an excessive result set. Each payment account will be provided with its characteristics.


        ### Specific for the Sandbox


        - For this sandbox, **the data is fictive**, we put the account lists of a fictive user “ User 1” at TPP’s disposal.


        - The « User 1 » owns 5 accounts : one Dutch account in EUR, one Polish account in EUR, one Greek account in EUR and 2 Danish accounts in DKK.


        - The “Signature” and “X Request ID” parameters will not be verified by our sandbox for the test. They must be not null.'
      security:
      - OAuth2:
        - aisp
      parameters:
      - $ref: '#/components/parameters/PsuIpAddressHeader'
      - $ref: '#/components/parameters/PsuIpPortHeader'
      - $ref: '#/components/parameters/PsuHttpMethodHeader'
      - $ref: '#/components/parameters/PsuDateHeader'
      - $ref: '#/components/parameters/PsuGeoLocation'
      - $ref: '#/components/parameters/PsuUserAgentHeader'
      - $ref: '#/components/parameters/PsuRefererHeader'
      - $ref: '#/components/parameters/PsuAcceptHeader'
      - $ref: '#/components/parameters/PsuAcceptCharsetHeader'
      - $ref: '#/components/parameters/PsuAcceptEncodingHeader'
      - $ref: '#/components/parameters/PsuAcceptLanguageHeader'
      - $ref: '#/components/parameters/PsuDeviceId'
      - $ref: '#/components/parameters/DigestHeader'
      - $ref: '#/components/parameters/SignatureHeader'
      - $ref: '#/components/parameters/Correlation'
      responses:
        '200':
          description: 'The ASPSP return a PSU context

            - listing the accounts that have been made available to the AISP by the PSU and,

            - for each of these accounts, the further transactions that have been enabled by the PSU through HYPERMEDIA links.

            '
          headers:
            X-Request-ID:
              description: 'Correlation header to be set in a request and retrieved in the relevant response

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HalAccounts'
        '204':
          $ref: '#/components/responses/204'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '406':
          $ref: '#/components/responses/406'
        '408':
          $ref: '#/components/responses/408'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /v2/accounts/{accountResourceId}/balances:
    get:
      operationId: accountsBalancesGet
      description: '### Description


        This call returns a set of balances for a given PSU account that is specified by the AISP through an account resource Identification.


        The answer to this request will provide the account balance but also other balances which are currently made available for clients through the Connexis Cash platform.


        On the Connexis Cash platform the client can access Ledger (booked or available) and Value (booked, without intraday or available, with intraday) balances. Those balances will be provided in the answer to the request while complying with STET standards. For more information, please find below the corresponding table:


        STET

        Balances code

        Connexis Balances


        CLBD

        Accounting Balance

        Ledger Booked


        XPCD

        Instant Balance

        Ledger available


        VALU

        Value-date balance

        Value Booked (without intraday)


        OTHR

        Other Balance

        Value available (with intraday)


        *Furthermore, some optional fields present in the STET documentation are not communicated through the API because they are currently not transmitted to our clients or they are specific to the retail segment (lastChangeDateTime and lastCommittedTransaction).*


        ### Prerequisites

        - The TPP has been registered by the Registration Authority for the AISP role. (not mandatory for Sandbox)

        - The TPP and the PSU have a contract that has been enrolled by the ASPSP (not mandatory for Sandbox)

        - At this step, Connexis Cash has delivered an OAUTH2 access token to the TPP via OAuth2 flow : Authorization Code Grant (for production) or Client Credential (for sandbox).


        For more details about OAuth2 flow, please click on the links below :


        - Authorization Code Grant flow : https://developers.cib.bnpparibas.com/docs/auth2-ac-psd2


        - Client Credential flow : https://developers.cib.bnpparibas.com/docs/auth2-cc


        - The TPP and the ASPSP have successfully processed a mutual check and authentication

        - The TPP has presented its OAUTH2 access token

        - Connexis Cash takes into account the access token that establishes the link between the PSU and the AISP.

        - The TPP has previously retrieved the list of available accounts for the PSU


        ### Business Flow


        - The AISP requests the ASPSP on one of the PSU’s accounts. The ASPSP answers by providing a list of balances on this account.


        ### Specific for the Sandbox


        - To get positive results (200 response), i.e. accessing the fake data provided by Connexis Cash, it is necessary to indicate a valid accountResourceId. In case an invalid "accountResourceId" is present, an error message will be displayed.


        - The list of valid accountResourceId can be obtained via the get/accounts request in the resourceId field or below:


        - 1306171745


        - 1306171845


        - 1987376645


        - 19737006845


        - 19737007345


        - The “Signature” and “X Request ID” parameters will not be verified by our sandbox for

        the test. They must be not null.'
      summary: Retrieval of an account balances report (AISP)
      tags:
      - AISP
      security:
      - OAuth2:
        - aisp
      parameters:
      - $ref: '#/components/parameters/AccountResourceIdentification'
      - $ref: '#/components/parameters/PsuIpAddressHeader'
      - $ref: '#/components/parameters/PsuIpPortHeader'
      - $ref: '#/components/parameters/PsuHttpMethodHeader'
      - $ref: '#/components/parameters/PsuDateHeader'
      - $ref: '#/components/parameters/PsuGeoLocation'
      - $ref: '#/components/parameters/PsuUserAgentHeader'
      - $ref: '#/components/parameters/PsuRefererHeader'
      - $ref: '#/components/parameters/PsuAcceptHeader'
      - $ref: '#/components/parameters/PsuAcceptCharsetHeader'
      - $ref: '#/components/parameters/PsuAcceptEncodingHeader'
      - $ref: '#/components/parameters/PsuAcceptLanguageHeader'
      - $ref: '#/components/parameters/PsuDeviceId'
      - $ref: '#/components/parameters/DigestHeader'
      - $ref: '#/components/parameters/SignatureHeader'
      - $ref: '#/components/parameters/Correlation'
      responses:
        '200':
          description: The ASPSP answers with a list of account balances
          headers:
            X-Request-ID:
              description: 'Correlation header to be set in a request and retrieved in the relevant response

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HalBalances'
        '204':
          $ref: '#/components/responses/204'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '406':
          $ref: '#/components/responses/406'
        '408':
          $ref: '#/components/responses/408'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /v2/accounts/{accountResourceId}/transactions:
    get:
      operationId: accountsTransactionsGet
      description: '### Description


        This call returns transactions for an account for a given PSU account that is specified by the AISP through an account resource identification.


        The request may use some filter parameter in order to restrict the query, on a given imputation date range


        *As Connexis Cash does not permit its clients to filter on a given technical incremental identifier (optional filter AfterEntryReference proposed by STET), our API does not support this type of filter.*


        The maximum transaction history range returned is 13 months. (Note : there are no error messages if the query parameter “entryDateTo” of the request contains a date older than 13 months) .In the absence of query Parameters (entryDateFrom and entryDateTo), the period returned by default is 8 days : (fromdate is -2 days and To date is + 5days).


        The result may be subject to pagination (i.e. retrieving a partial result in case of having too many results) through a set of pages by the ASPSP.


        Optional parameters can be added by the TPP: PageSize and Page Number (by default, in the absence of value, the parameters are PageSize = 10 and Page Number = 0)


        *All fields specified by STET will be made available for a TPP, except the optional fields « RessourceID » and « entryReference ».*


        *Moreover, there is currently a technical identification attribute of the transaction but this one is for internal use only and cannot be passed to the clients.*

        *The “status” field is converted in order to comply with STET standards. You will find below the information:*


        - BOOK: (ISO20022 ClosingBooked) Accounted transaction : “B”


        - PDNG: (ISO20022 Expected) Instant Balance Transaction : “I”


        ### Prerequisites


        - The TPP has been registered by the Registration Authority for the AISP role. (not mandatory for Sandbox)

        - The TPP and the PSU have a contract that has been enrolled by the ASPSP (not mandatory for Sandbox)

        - At this step, Connexis Cash has delivered an OAUTH2 access token to the TPP via OAuth2 flow : Authorization Code Grant (for production) or Client Credential (for sandbox).


        For more details about OAuth2 flow, please click on the links below :


        - Authorization Code Grant flow : https://developers.cib.bnpparibas.com/docs/auth2-ac-psd2


        - Client Credential flow : https://developers.cib.bnpparibas.com/docs/auth2-cc


        - The TPP and the ASPSP have successfully processed a mutual check and authentication

        - The TPP has presented its OAUTH2 access token

        - Connexis Cash takes into account the access token that establishes the link between the PSU and the AISP.

        - The TPP has previously retrieved the list of available accounts for the PSU


        ### Business Flow


        The AISP requests the ASPSP on one of the PSU’s accounts. It may specify some selection criteria (Date From / Date To).


        The ASPSP answers by a set of transactions that matches the query.


        The result may be subject to pagination in order to avoid an excessive result set.


        ### Specific for the Sandbox


        - To get positive results (200 response) i.e. accessing the fake data provided by Connexis Cash, it is necessary to indicate a valid accountResourceId. In case of invalid accountResourceId, un error message is displayed.


        - The list of valid accountResourceId can be retrieved via the get/accounts request in the resourceId field or below :


        Account Ressource ID

        Transactions


        1306171745

        00


        1306171845

        10


        1987376645

        02


        19737006845

        00


        19737007345

        09


        - Among the proposed accounts, 19737007345 and 1987376645 have an associated transactions list (10 transactions for 1306171845 and 2 transactions for 1987376645).

        - For the sandbox, there will be no pagination in the result.

        - The “Signature” and “X Request ID” parameters will not be verified by our sandbox for the test. They must be not null.

        - The date format is yyyy-mm-dd'
      summary: Retrieval of an account transaction set (AISP)
      security:
      - OAuth2:
        - aisp
      tags:
      - AISP
      parameters:
      - $ref: '#/components/parameters/AccountResourceIdentification'
      - $ref: '#/components/parameters/FromImputationDate'
      - $ref: '#/components/parameters/ToImputationDate'
      - $ref: '#/components/parameters/pageNumber'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/PsuIpAddressHeader'
      - $ref: '#/components/parameters/PsuIpPortHeader'
      - $ref: '#/components/parameters/PsuHttpMethodHeader'
      - $ref: '#/components/parameters/PsuDateHeader'
      - $ref: '#/components/parameters/PsuGeoLocation'
      - $ref: '#/components/parameters/PsuUserAgentHeader'
      - $ref: '#/components/parameters/PsuRefererHeader'
      - $ref: '#/components/parameters/PsuAcceptHeader'
      - $ref: '#/components/parameters/PsuAcceptCharsetHeader'
      - $ref: '#/components/parameters/PsuAcceptEncodingHeader'
      - $ref: '#/components/parameters/PsuAcceptLanguageHeader'
      - $ref: '#/components/parameters/PsuDeviceId'
      - $ref: '#/components/parameters/DigestHeader'
      - $ref: '#/components/parameters/SignatureHeader'
      - $ref: '#/components/parameters/Correlation'
      responses:
        '200':
          description: Complete transactions response
          headers:
            X-Request-ID:
              description: 'Correlation header to be set in a request and retrieved in the relevant response

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HalTransactions'
        '204':
          $ref: '#/components/responses/204'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '406':
          $ref: '#/components/responses/406'
        '408':
          $ref: '#/components/responses/408'
        '429':
          $ref: '#/components/responses/429'
