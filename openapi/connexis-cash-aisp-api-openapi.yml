  /v2/trusted-beneficiaries:
    get:
      operationId: trustedBeneficiariesGet
      tags:
      - AISP
      summary: Retrieval of the trusted beneficiaries list (AISP)
      description: '### Description


        The trusted counterparties list is considered as the authorized counterparties list so that a payment could be initiated without SCA. The list, if provided by an ASPSP, should be put at the AISP’s disposal as he is currently able to visualize it via the ASPSP online interface.


        In Connexis Cash, an entity can register a counterparty in a list of usual counterparties. However for payment authorization, strong authentication (SCA) is systematically requested. **The list of counterparties is not a trusted list of counterparties as described in the RTS, this is why this request will not return any result, (200 empty Response []).**


        - The “Signature” and “X Request ID” parameters will not be verified by our sandbox for

        the test. They must be not null.


        ### Prerequisites


        - The TPP has been registered by the Registration Authority for the AISP role. (not mandatory for Sandbox)

        - The TPP and the PSU have a contract that has been enrolled by the ASPSP (not mandatory for Sandbox)

        - At this step, Connexis Cash has delivered an OAUTH2 access token to the TPP via OAuth2 flow : Authorization Code Grant (for production) or Client Credential (for sandbox).


        For more details about OAuth2 flow, please click on the links below :


        - Authorization Code Grant flow : https://developers.cib.bnpparibas.com/docs/auth2-ac-psd2


        - Client Credential flow : https://developers.cib.bnpparibas.com/docs/auth2-cc


        - The TPP and the ASPSP have successfully processed a mutual check and authentication

        - The TPP has presented its OAUTH2 access token'
      security:
      - OAuth2:
        - aisp
      parameters:
      - $ref: '#/components/parameters/PsuIpAddressHeader'
      - $ref: '#/components/parameters/PsuIpPortHeader'
      - $ref: '#/components/parameters/PsuHttpMethodHeader'
      - $ref: '#/components/parameters/PsuDateHeader'
      - $ref: '#/components/parameters/PsuGeoLocation'
      - $ref: '#/components/parameters/PsuUserAgentHeader'
      - $ref: '#/components/parameters/PsuRefererHeader'
      - $ref: '#/components/parameters/PsuAcceptHeader'
      - $ref: '#/components/parameters/PsuAcceptCharsetHeader'
      - $ref: '#/components/parameters/PsuAcceptEncodingHeader'
      - $ref: '#/components/parameters/PsuAcceptLanguageHeader'
      - $ref: '#/components/parameters/PsuDeviceId'
      - $ref: '#/components/parameters/DigestHeader'
      - $ref: '#/components/parameters/SignatureHeader'
      - $ref: '#/components/parameters/Correlation'
      responses:
        '200':
          description: 'The ASPSP returns the list of whitelisted beneficiaries

            '
          headers:
            X-Request-ID:
              description: 'Correlation header to be set in a request and retrieved in the relevant response

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HalBeneficiaries'
        '204':
          $ref: '#/components/responses/204'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '406':
